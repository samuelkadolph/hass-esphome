substitutions:
  name: sump-water-sensor
  friendly_name: Sump Water Sensor
  project_name: samuelkadolph.${name}
  project_version: "0.1"

  logging: DEBUG

  reading_alpha: 0.25f
  reading_publish_delta: 0.002f
  reading_interval: 1000ms
  reading_trigger_pulse: 2ms

  sensor_rx_pin: GPIO21
  sensor_tx_pin: GPIO22
  sensor_baud: 9600

api:
  encryption:
    key: !secret api_encryption_key

  on_client_connected: [ script.execute: set_status_led ]
  on_client_disconnected: [ script.execute: set_status_led ]

captive_portal:

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: ${logging}

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: ${friendly_name}
    password: !secret fallback_password

  on_connect: [ script.execute: set_status_led ]
  on_disconnect: [ script.execute: set_status_led ]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  project:
    name: ${project_name}
    version: ${project_version}

  on_boot: [ script.execute: set_status_led ]

globals:
- id: water_distance
  type: float
  initial_value: NAN

binary_sensor:
- platform: gpio
  name: Button
  disabled_by_default: true
  entity_category: diagnostic
  pin:
    ignore_strapping_warning: true
    inverted: true
    number: GPIO09

button:
- platform: template
  name: Set Zero Level
  entity_category: config
  on_press:
  - lambda: id(zero_level).publish_state(id(water_distance));

- platform: restart
  name: Restart
  entity_category: diagnostic

interval:
- interval: 1s
  then: [ script.execute: set_status_led ]

- interval: ${reading_interval}
  then: [ script.execute: trigger_reading ]

light:
- platform: esp32_rmt_led_strip
  id: status_led
  chipset: WS2812
  default_transition_length: 0ms
  num_leds: 1
  pin:
    ignore_strapping_warning: true
    number: GPIO08
  rgb_order: RGB
  rmt_symbols: 48

number:
- platform: template
  id: alarm_level
  name: Alarm Level
  initial_value: 0.0
  <<: &level
    device_class: distance
    max_value: 450.0
    min_value: 0.0
    optimistic: true
    restore_value: true
    step: 0.1
    unit_of_measurement: cm

- platform: template
  id: zero_level
  name: Zero Level
  initial_value: 450.0
  <<: *level

output:
- platform: gpio
  id: sensor_tx
  pin:
    inverted: true
    number: ${sensor_tx_pin}

script:
- id: set_status_led
  then:
  - lambda: |-
      if (api::global_api_server->is_connected()) {
        id(status_led).turn_on().set_brightness(0.2).set_rgb(0.0, 1.0, 0.0).perform();
      } else if (wifi::global_wifi_component->is_connected()) {
        id(status_led).turn_on().set_brightness(0.3).set_rgb(0.0, 0.0, 1.0).perform();
      } else if (wifi::global_wifi_component->is_ap_active()) {
        id(status_led).turn_on().set_brightness(0.3).set_rgb(0.5, 0.0, 0.5).perform();
      } else {
        id(status_led).turn_on().set_brightness(0.3).set_rgb(1.0, 0.0, 0.0).perform();
      }

- id: trigger_reading
  then:
  - output.turn_on: sensor_tx
  - delay: ${reading_trigger_pulse}
  - output.turn_off: sensor_tx

sensor:
- platform: template
  id: water_level
  name: Water Level
  accuracy_decimals: 0
  device_class: distance
  state_class: measurement
  unit_of_measurement: mm
  update_interval: 5s
  lambda: |-
    if (isnan(id(water_distance))) return NAN;
    if (!id(zero_level).has_state()) return NAN;
    return id(zero_level).state - id(water_distance);

- platform: wifi_signal
  name: Signal Strength
  entity_category: diagnostic
  filters:
  - sliding_window_moving_average:
      send_every: 5
      window_size: 5

- platform: uptime
  name: Uptime
  entity_category: diagnostic

text_sensor:
- platform: wifi_info
  mac_address:
    name: MAC Address
    entity_category: diagnostic
  ip_address:
    name: IP Address
    entity_category: diagnostic

uart:
  rx_pin: ${sensor_rx_pin}
  baud_rate: ${sensor_baud}
  debug:
    direction: RX
    dummy_receiver: true
    after:
      bytes: 4
    sequence:
    - lambda: |-
        if (bytes.size() != 4) return;

        uint8_t header = bytes[0], high = bytes[1], low = bytes[2], csum = bytes[3];

        if (header != 0xFF) return;
        if (((header + high + low) & 0xFF) != csum) return;

        float reading = ((high << 8) + low);

        if (isnan(id(water_distance))) {
          id(water_distance) = round(reading);
        } else {
          id(water_distance) = round(reading * ${reading_alpha} + id(water_distance) * (1.0f - ${reading_alpha}));
        }

        ESP_LOGD("sensor", "reading=%f water_distance=%f", reading, id(water_distance));
