substitutions:
  name: esp32s3-test
  friendly_name: ESP32S3 Test
  project_name: samuelkadolph.${name}
  project_version: "0.1"

  logging: DEBUG

  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password

  wifi_ssid: !secret kadolph_devices_ssid
  wifi_password: !secret kadolph_devices_pass
  wifi_fallback_ssid: ${friendly_name}
  wifi_fallback_password: !secret fallback_ap_pass

api:
  encryption:
    key: ${api_encryption_key}

captive_portal:

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: ${logging}

ota:
- platform: esphome
  password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: ${wifi_fallback_ssid}
    password: ${wifi_fallback_password}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: ${project_name}
    version: ${project_version}

binary_sensor:
- platform: gpio
  name: Button
  disabled_by_default: true
  entity_category: diagnostic
  pin:
    ignore_strapping_warning: true
    inverted: true
    number: GPIO00

button:
- platform: factory_reset
  name: Factory Reset
  disabled_by_default: true
  entity_category: diagnostic

- platform: restart
  name: Restart
  entity_category: diagnostic

interval:
- interval: 2000ms
  then:
  - lambda: |-
      if (esphome::api::global_api_server->is_connected_with_state_subscription()) {
        id(status_led).turn_on().set_flash_length(1000).set_brightness(0.3).set_rgb(0.0, 1.0, 0.0).perform();
      } else if (esphome::wifi::global_wifi_component->is_connected()) {
        id(status_led).turn_on().set_flash_length(1000).set_brightness(0.4).set_rgb(0.0, 0.0, 1.0).perform();
      } else if (esphome::wifi::global_wifi_component->is_ap_active()) {
        id(status_led).turn_on().set_flash_length(1000).set_brightness(0.4).set_rgb(0.5, 0.0, 0.5).perform();
      } else {
        id(status_led).turn_on().set_flash_length(1000).set_brightness(0.4).set_rgb(1.0, 0.0, 0.0).perform();
      }

light:
- platform: esp32_rmt_led_strip
  id: status_led
  chipset: WS2812
  default_transition_length: 0ms
  initial_state:
    blue: 0.0
    green: 0.0
    red: 0.0
  num_leds: 1
  pin: GPIO21
  rgb_order: RGB

sensor:
- platform: wifi_signal
  name: Signal Strength
  entity_category: diagnostic
  filters:
  - sliding_window_moving_average:
      send_every: 5
      window_size: 5

- platform: uptime
  name: Uptime
  entity_category: diagnostic

text_sensor:
- platform: wifi_info
  mac_address:
    name: MAC Address
    entity_category: diagnostic
  ip_address:
    name: IP Address
    entity_category: diagnostic
